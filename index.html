<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行動版智慧早安圖與音樂產生器</title>
    <!-- Tailwind CSS 樣式框架 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        .font-serif-tc { font-family: 'Noto Serif TC', serif; }
        .font-handwriting { font-family: 'Zhi Mang Xing', cursive; }
        input, select, textarea { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between antialiased">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-xs sticky top-0 z-20 py-3 px-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <h1 class="text-base sm:text-lg font-bold text-emerald-700 flex items-center gap-1.5">
                🌅 早安圖與音樂產生器
            </h1>
            <span class="text-[11px] bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium">iOS PWA & Music Ready</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4 w-full grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 mb-8">
        
        <!-- 左側：控制面板 -->
        <section class="bg-white p-4 sm:p-6 rounded-2xl shadow-xs border border-slate-200 flex flex-col gap-4 lg:col-span-6 order-2 lg:order-1">
            <!-- 頂部區塊：標題與重新生成文字 -->
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h2 class="text-base font-semibold text-slate-700 flex items-center gap-1.5">
                    🎨 編輯文字與背景
                </h2>
                <button onclick="randomizeText()" class="bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 text-xs px-3 py-1.5 rounded-lg font-medium transition cursor-pointer flex items-center gap-1 shadow-2xs">
                    🔄 重新生成文字
                </button>
            </div>

            <!-- 背景圖片選擇、重新生成圖片與自行上傳 -->
            <div class="flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <label class="block text-xs sm:text-sm font-medium text-slate-600">背景意境圖片主題</label>
                    <button onclick="changeBackground()" class="text-emerald-700 hover:text-emerald-800 text-xs font-semibold flex items-center gap-1 cursor-pointer bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1 rounded-md transition">
                        🖼️ 重新生成圖片
                    </button>
                </div>
                <div class="flex gap-2">
                    <select id="categorySelect" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="nature">山林晨曦 (Nature)</option>
                        <option value="sunrise">日出光芒 (Sunrise)</option>
                        <option value="flower">花卉植物 (Flowers)</option>
                        <option value="fog">雲霧山嵐 (Misty)</option>
                    </select>
                    <button onclick="changeBackground()" class="bg-emerald-600 active:bg-emerald-800 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer whitespace-nowrap shadow-xs">
                        換一張
                    </button>
                </div>
                <!-- 自行上傳照片功能 -->
                <div class="mt-1">
                    <label class="w-full flex items-center justify-center gap-2 border border-dashed border-slate-300 hover:border-emerald-500 bg-slate-50 hover:bg-emerald-50/30 text-slate-600 rounded-xl p-2.5 text-xs sm:text-sm font-medium transition cursor-pointer">
                        📁 <span>點擊自行上傳相片</span>
                        <input type="file" id="uploadImageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    </label>
                </div>
            </div>

            <!-- 主標題文字與顏色 -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs sm:text-sm font-medium text-slate-600">早安主標題</label>
                    <div class="flex items-center gap-1.5">
                        <span class="text-[11px] text-slate-400">顏色</span>
                        <input type="color" id="mainColor" value="#FFFFFF" class="w-6 h-6 rounded border border-slate-300 cursor-pointer p-0 bg-transparent" onchange="drawCanvas()">
                    </div>
                </div>
                <input type="text" id="mainText" value="早安安，美好的一天開始！" 
                    class="w-full border border-slate-300 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none"
                    oninput="drawCanvas()">
            </div>

            <!-- 副標題文字與顏色 -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs sm:text-sm font-medium text-slate-600">溫馨小語 / 金句</label>
                    <div class="flex items-center gap-1.5">
                        <span class="text-[11px] text-slate-400">顏色</span>
                        <input type="color" id="subColor" value="#F3F4F6" class="w-6 h-6 rounded border border-slate-300 cursor-pointer p-0 bg-transparent" onchange="drawCanvas()">
                    </div>
                </div>
                <textarea id="subText" rows="3" 
                    class="w-full border border-slate-300 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none resize-none"
                    oninput="drawCanvas()">心境放寬，福氣自來。願你今日平安喜樂，順心如意！</textarea>
            </div>

            <!-- 署名與顏色 -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs sm:text-sm font-medium text-slate-600">署名 / 日期</label>
                    <div class="flex items-center gap-1.5">
                        <span class="text-[11px] text-slate-400">顏色</span>
                        <input type="color" id="authorColor" value="#E2E8F0" class="w-6 h-6 rounded border border-slate-300 cursor-pointer p-0 bg-transparent" onchange="drawCanvas()">
                    </div>
                </div>
                <input type="text" id="authorText" value="平安喜樂 · 祝福您" 
                    class="w-full border border-slate-300 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none"
                    oninput="drawCanvas()">
            </div>

            <!-- 字型大小調整滑桿 -->
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <label class="text-xs sm:text-sm font-medium text-slate-700">字型大小比例</label>
                    <span id="fontSizeValue" class="text-xs font-semibold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-md">100%</span>
                </div>
                <input type="range" id="fontSizeRange" min="70" max="140" value="100" step="5" 
                    class="w-full accent-emerald-600 cursor-pointer"
                    oninput="updateFontSizeLabel(); drawCanvas();">
            </div>

            <!-- 文字位置排版 -->
            <div>
                <label class="block text-xs sm:text-sm font-medium text-slate-600 mb-1">文字對齊與位置</label>
                <select id="positionSelect" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none" onchange="drawCanvas()">
                    <option value="center">置中優雅排版</option>
                    <option value="top">靠上精緻排版</option>
                    <option value="bottom">置底溫馨排版</option>
                </select>
            </div>

            <!-- 背景音樂設定區塊 -->
            <div class="bg-teal-50/50 p-3.5 rounded-xl border border-teal-100 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="enableMusic" class="w-4 h-4 accent-teal-600 rounded cursor-pointer" onchange="toggleMusicSettings()">
                        <span class="text-xs sm:text-sm font-semibold text-teal-900">🎵 加背景音樂 (無版權輕音樂)</span>
                    </label>
                </div>
                
                <div id="musicOptions" class="hidden flex flex-col gap-2 pt-1 border-t border-teal-100">
                    <div>
                        <label class="block text-[11px] font-medium text-teal-800 mb-1">選擇無版權音樂風格</label>
                        <select id="musicTrack" class="w-full border border-teal-200 rounded-lg p-2 text-xs bg-white text-teal-900 outline-none">
                            <option value="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=peaceful-piano-ambient-111429.mp3">和平清晨鋼琴 (Peaceful Piano)</option>
                            <option value="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=gentle-lofi-chill-10515.mp3">輕柔舒緩 Lofi (Gentle Lofi)</option>
                            <option value="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c3a63d9d.mp3?filename=meditation-nature-10777.mp3">自然療癒心靈 (Meditation Nature)</option>
                        </select>
                    </div>
                    
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-[11px] text-teal-800 font-medium">播放長度限制：</span>
                        <select id="musicDuration" class="border border-teal-200 rounded-lg p-1.5 text-xs bg-white text-teal-900 outline-none">
                            <option value="10">10 秒</option>
                            <option value="15" selected>15 秒</option>
                            <option value="30">30 秒</option>
                            <option value="60">60 秒</option>
                        </select>
                    </div>

                    <button onclick="previewMusic()" id="playMusicBtn" class="mt-1 bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white text-xs font-medium py-2 rounded-lg transition flex items-center justify-center gap-1.5 cursor-pointer">
                        ▶️ 試聽音樂片段
                    </button>
                </div>
            </div>

            <!-- 下載按鈕 (iOS 閃退修復方案：彈出預覽視窗供長按儲存) -->
            <button onclick="openDownloadModal()" class="mt-2 w-full bg-gradient-to-r from-emerald-600 to-teal-600 active:scale-98 hover:from-emerald-700 hover:to-teal-700 text-white font-semibold py-3.5 rounded-xl shadow-md transition cursor-pointer flex items-center justify-center gap-2 text-base">
                📥 下載高畫質早安圖
            </button>
        </section>

        <!-- 右側：即時預覽畫布區 -->
        <section class="bg-white p-4 sm:p-6 rounded-2xl shadow-xs border border-slate-200 lg:col-span-6 flex flex-col items-center justify-center order-1 lg:order-2">
            <h2 class="text-base font-semibold border-b border-slate-100 pb-2 text-slate-700 w-full mb-3 flex items-center justify-between">
                <span>🖼️ 即時預覽</span>
                <span class="text-xs text-slate-400 font-normal">自動縮放適應螢幕</span>
            </h2>
            
            <div class="relative w-full max-w-[280px] sm:max-w-[320px] aspect-[4/5] bg-slate-200 rounded-xl overflow-hidden shadow-sm flex items-center justify-center">
                <canvas id="morningCanvas" class="w-full h-full object-cover"></canvas>
                <div id="loadingIndicator" class="absolute inset-0 bg-black/50 text-white flex items-center justify-center text-xs sm:text-sm font-medium backdrop-blur-xs transition-opacity">
                    載入圖片中...
                </div>
            </div>
            <p class="text-[11px] sm:text-xs text-slate-400 mt-2.5 text-center">
                💡 iOS 加到主畫面後，點擊下載會彈出圖檔，長按圖片即可「加入照片」！
            </p>
        </section>

    </main>

    <!-- iOS 專屬防閃退下載 Modal 彈跳視窗 -->
    <div id="downloadModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden backdrop-blur-xs">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 flex flex-col items-center shadow-2xl animate-in fade-in zoom-in duration-200">
            <h3 class="text-base font-bold text-slate-800 mb-1">📥 長按圖片即可儲存</h3>
            <p class="text-xs text-slate-500 mb-3 text-center">因 iOS Safari 限制，請直接長按下方圖片並選擇「加入照片」或「儲存影像」</p>
            
            <div class="w-full aspect-[4/5] bg-slate-100 rounded-xl overflow-hidden border border-slate-200 mb-4 flex items-center justify-center relative">
                <img id="modalImagePreview" class="w-full h-full object-contain" alt="早安圖預覽">
            </div>

            <div class="flex gap-2 w-full">
                <a id="directDownloadLink" download="morning-greeting.png" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-center py-2.5 rounded-xl text-sm font-medium shadow-xs transition">
                    直接下載檔案
                </a>
                <button onclick="closeDownloadModal()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer">
                    關閉視窗
                </button>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-400">
        <p>Morning Greeting Generator &bull; iOS PWA & Audio Optimized</p>
    </footer>

    <!-- JavaScript 核心邏輯 -->
    <script>
        const canvas = document.getElementById('morningCanvas');
        const ctx = canvas.getContext('2d');
        const loadingIndicator = document.getElementById('loadingIndicator');

        canvas.width = 800;
        canvas.height = 1000;

        let currentImg = new Image();
        currentImg.crossOrigin = "anonymous";

        let audioPlayer = null;
        let audioTimer = null;

        const categories = {
            nature: "morning,nature,forest",
            sunrise: "sunrise,morning,sunlight",
            flower: "flower,blossom,spring",
            fog: "fog,mist,mountain,landscape"
        };

        const textPresets = [
            {
                main: "早安安，美好的一天開始！",
                sub: "心境放寬，福氣自來。願你今日平安喜樂，順心如意！",
                author: "平安喜樂 · 祝福您"
            },
            {
                main: "晨光好，願你有個充滿活力的一天！",
                sub: "把煩惱留在昨天，把微笑帶給今天。加油！",
                author: "溫馨問候 · 祝您順心"
            },
            {
                main: "早安！陽光正好，微風不燥。",
                sub: "生活不需要過多繁華，開心就好；日子不需要過多奢求，平安就好。",
                author: "好友祝福 · 每一天都美好"
            },
            {
                main: "新的一天，新的希望！",
                sub: "帶著微笑出發，把最好的自己展現給世界。早安吉祥！",
                author: "吉祥如意 · 天天開心"
            },
            {
                main: "早安！平安健康就是最大的幸福。",
                sub: "感恩所有的相遇與陪伴，願你今天被世界溫柔以待。",
                author: "福慧雙修 · 祝安康"
            },
            {
                main: "晨曦初露，福氣滿屋。早安！",
                sub: "保持好心情，好運自然來。祝你今天事事順心！",
                author: "開心每一天 · 祝福相隨"
            }
        ];

        function randomizeText() {
            const randomIndex = Math.floor(Math.random() * textPresets.length);
            const selected = textPresets[randomIndex];

            document.getElementById('mainText').value = selected.main;
            document.getElementById('subText').value = selected.sub;
            document.getElementById('authorText').value = selected.author;

            drawCanvas();
        }

        function updateFontSizeLabel() {
            const val = document.getElementById('fontSizeRange').value;
            document.getElementById('fontSizeValue').innerText = val + '%';
        }

        function changeBackground() {
            loadingIndicator.style.opacity = '1';
            loadingIndicator.innerText = "正在重新生成圖片...";
            const randomId = Math.floor(Math.random() * 10000);
            currentImg.src = `https://picsum.photos/seed/${randomId}/800/1000`;
        }

        // 自行上傳照片處理
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            loadingIndicator.style.opacity = '1';
            loadingIndicator.innerText = "正在載入上傳相片...";

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImg.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        currentImg.onload = function() {
            loadingIndicator.style.opacity = '0';
            drawCanvas();
        };

        currentImg.onerror = function() {
            loadingIndicator.innerText = "圖片載入失敗，請重試";
        };

        function drawCanvas() {
            if (!currentImg.complete) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(currentImg, 0, 0, canvas.width, canvas.height);

            const position = document.getElementById('positionSelect').value;
            let gradient;
            if (position === 'top') {
                gradient = ctx.createLinearGradient(0, 0, 0, 700);
                gradient.addColorStop(0, 'rgba(0, 0, 0, 0.65)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            } else if (position === 'bottom') {
                gradient = ctx.createLinearGradient(0, 300, 0, 1000);
                gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0.75)');
            } else {
                gradient = ctx.createRadialGradient(400, 500, 100, 400, 500, 600);
                gradient.addColorStop(0, 'rgba(0, 0, 0, 0.15)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const mainText = document.getElementById('mainText').value;
            const subText = document.getElementById('subText').value;
            const authorText = document.getElementById('authorText').value;

            const mainColor = document.getElementById('mainColor').value;
            const subColor = document.getElementById('subColor').value;
            const authorColor = document.getElementById('authorColor').value;

            const scale = parseFloat(document.getElementById('fontSizeRange').value) / 100;

            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            let startY = 500;
            if (position === 'top') startY = 200;
            if (position === 'bottom') startY = 720;

            // 主標題
            const mainFontSize = Math.round(52 * scale);
            ctx.font = `bold ${mainFontSize}px "Noto Serif TC", serif`;
            ctx.fillStyle = mainColor;
            ctx.fillText(mainText, 400, startY);

            // 副標題
            const subFontSize = Math.round(32 * scale);
            const subLineHeight = Math.round(46 * scale);
            ctx.font = `${subFontSize}px "Noto Serif TC", serif`;
            ctx.fillStyle = subColor;
            wrapText(ctx, subText, 400, startY + Math.round(75 * scale), 680, subLineHeight, subColor);

            // 署名
            const authorFontSize = Math.round(26 * scale);
            ctx.font = `italic ${authorFontSize}px sans-serif`;
            ctx.fillStyle = authorColor;
            
            let authorY = startY + Math.round(180 * scale);
            if (subText.length > 25) authorY += Math.round(40 * scale);
            ctx.fillText(authorText, 400, authorY);

            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight, color) {
            const paragraphs = text.split('\n');
            let currentY = y;
            
            for (let p = 0; p < paragraphs.length; p++) {
                let chars = paragraphs[p].split('');
                let line = '';
                
                for (let n = 0; n < chars.length; n++) {
                    let testLine = line + chars[n];
                    let metrics = context.measureText(testLine);
                    let testWidth = metrics.width;
                    
                    if (testWidth > maxWidth && n > 0) {
                        context.fillStyle = color;
                        context.fillText(line, x, currentY);
                        line = chars[n];
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                context.fillStyle = color;
                context.fillText(line, x, currentY);
                currentY += lineHeight;
            }
        }

        // 背景音樂控制開關
        function toggleMusicSettings() {
            const enable = document.getElementById('enableMusic').checked;
            const options = document.getElementById('musicOptions');
            if (enable) {
                options.classList.remove('hidden');
            } else {
                options.classList.add('hidden');
                stopMusic();
            }
        }

        // 試聽背景音樂並控制時間長度
        function previewMusic() {
            const trackUrl = document.getElementById('musicTrack').value;
            const durationSec = parseInt(document.getElementById('musicDuration').value, 10);
            const btn = document.getElementById('playMusicBtn');

            if (audioPlayer) {
                stopMusic();
            }

            audioPlayer = new Audio(trackUrl);
            audioPlayer.play().then(() => {
                btn.innerText = "⏹️ 正在播放音樂...";
                btn.classList.remove('bg-teal-600', 'hover:bg-teal-700');
                btn.classList.add('bg-rose-600', 'hover:bg-rose-700');
                btn.setAttribute('onclick', 'stopMusic()');

                // 設定指定秒數後自動停止
                audioTimer = setTimeout(() => {
                    stopMusic();
                }, durationSec * 1000);
            }).catch(e => {
                alert("播放被瀏覽器阻擋或載入失敗，請再試一次。");
            });
        }

        function stopMusic() {
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer = null;
            }
            if (audioTimer) {
                clearTimeout(audioTimer);
                audioTimer = null;
            }
            const btn = document.getElementById('playMusicBtn');
            if (btn) {
                btn.innerText = "▶️ 試聽音樂片段";
                btn.classList.remove('bg-rose-600', 'hover:bg-rose-700');
                btn.classList.add('bg-teal-600', 'hover:bg-teal-700');
                btn.setAttribute('onclick', 'previewMusic()');
            }
        }

        // iOS 防閃退下載 Modal 開啟
        function openDownloadModal() {
            const dataUrl = canvas.toDataURL('image/png', 1.0);
            document.getElementById('modalImagePreview').src = dataUrl;
            document.getElementById('directDownloadLink').href = dataUrl;
            document.getElementById('downloadModal').classList.remove('hidden');
        }

        function closeDownloadModal() {
            document.getElementById('downloadModal').classList.add('hidden');
        }

        window.onload = function() {
            changeBackground();
        };
    </script>
</body>
</html>
